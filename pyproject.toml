[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bark-check"
version = "0.1.0"
description = "犬の吠え声を検出する CLI ツール"
requires-python = ">=3.12"
dependencies = [
    "soundfile",
    "librosa",
    "onnxruntime",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]
train = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "onnxscript",
]

[project.scripts]
bark-check = "bark_check.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
